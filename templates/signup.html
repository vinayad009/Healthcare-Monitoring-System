<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Healthcare</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-4">
      <a class="navbar-brand" href="{% url 'home' %}">
        <img
          src="https://global-uploads.webflow.com/5e157548d6f7910beea4e2d6/62e7c3d0894fda6f903b0a5f_healthcare-logo-generator.png"
          alt="Logo"
          width="60"
          height="60"
        />
        Healthcare
      </a>
    </nav>

    <div
      class="container d-flex justify-content-center align-items-center"
      style="height: 100vh"
    >
      <div class="card p-4" style="width: 100%; max-width: 400px">
        <h3 class="text-center">Sign Up</h3>
        {% if messages %}
        <div class="alert alert-danger">
          {% for message in messages %} {{ message }} {% endfor %}
        </div>
        {% endif %}
        <form method="POST" action="">
          {% csrf_token %}
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              name="name"
              id="name"
              class="form-control"
              required
            />
          </div>
          <div class="form-group">
            <label>Gender</label>
              <div>
                <label class="mr-2">
                  <input type="radio" name="gender" value="Male" required /> Male
                </label>
                <label class="mr-2">
                  <input type="radio" name="gender" value="Female" /> Female
                </label>
              </div>
          </div>
          <div class="form-group">
            <label>Weigth</label>
              <div>
                <input type="number" name="weight" value="Male" required />
              </div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              class="form-control"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              required
            />
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input
              type="password"
              name="confirm_password"
              id="confirm_password"
              class="form-control"
              required
            />
          </div>
          <button type="submit" class="btn btn-success btn-block">
            Sign Up
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'login' organisation=0 %}">Already have an account? Log in</a>
        </div>
      </div>
    </div>
  </body>
</html>
